[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arnoldtare-costledger"
version = "0.1.0"
description = "按模型、令牌数、缓存命中与请求数拆出成本明细，输出账单式报告"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "arnoldtare" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://arnoldtare.github.io"
Repository = "https://github.com/arnoldtare/costledger"
Issues = "https://github.com/arnoldtare/costledger/issues"

[project.scripts]
costledger = "costledger:main"

[tool.setuptools]
py-modules = ["costledger"]
